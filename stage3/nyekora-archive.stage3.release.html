<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>니에코라 기록관 · Nyekora Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e1;--sf:#fffdf5;--ink:#14213d;--mu:#566074;--ln:#e2d8b8;--teal:#0f766e;--gold:#a9781c;--navy:#14213d;--ivory:#f6f1e1;--gl:#d6b25e;
--cb:#d9efec;--pb:#f4e6c2;--ub:#e6e8ec;--xb:#f3d9d9;--cx:#0b5c56;--px:#7a5410;--ux:#454c5a;--xx:#8a2a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1829;--sf:#15233a;--ink:#f1ead6;--mu:#a9b3c4;--ln:#2a3a57;--teal:#3cc1b3;--gold:#d6b25e;--cb:#12403f;--pb:#463a1a;--ub:#2a3447;--xb:#4a2326;--cx:#8fe3d9;--px:#ecd08a;--ux:#c6ccd8;--xx:#f0aaaa}}
:root[data-theme="dark"]{--bg:#0e1829;--sf:#15233a;--ink:#f1ead6;--mu:#a9b3c4;--ln:#2a3a57;--teal:#3cc1b3;--gold:#d6b25e;--cb:#12403f;--pb:#463a1a;--ub:#2a3447;--xb:#4a2326;--cx:#8fe3d9;--px:#ecd08a;--ux:#c6ccd8;--xx:#f0aaaa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 "Noto Sans KR",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
h1,h2,h3,.logo{font-family:"Noto Serif KR",Georgia,serif;line-height:1.35}
a{color:inherit}
:focus-visible{outline:3px solid var(--gl);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--navy);color:var(--ivory);border-bottom:2px solid var(--gl)}
.hd{max-width:1000px;margin:auto;padding:10px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;text-decoration:none;color:var(--ivory)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{padding:4px 10px;border-radius:6px;text-decoration:none;font-size:14px;white-space:nowrap;color:var(--ivory)}
nav a:hover,nav a[aria-current]{background:rgba(214,178,94,.22);color:var(--gl)}
.hero{background:linear-gradient(160deg,#14213d 0%,#14213d 55%,#0f5c58 100%);color:var(--ivory);text-align:center;padding:56px 16px 48px;border-bottom:2px solid var(--gl)}
.hero h1{font-size:clamp(28px,6vw,44px);margin:14px 0 8px}
.hero p{max-width:34em;margin:0 auto 24px;color:#ddd6bf}
.step{display:block;margin:auto}
.sb{display:flex;gap:8px;max-width:560px;margin:auto}
.sb input{flex:1;min-width:0;padding:12px 14px;border-radius:8px;border:2px solid transparent;font:inherit;background:#fffdf5;color:#14213d}
.sb input:focus{border-color:var(--gl);outline:none}
.sb button,.btn{padding:12px 18px;border-radius:8px;border:0;background:var(--gl);color:#14213d;font:700 15px "Noto Sans KR",sans-serif;cursor:pointer}
main{max-width:1000px;margin:auto;padding:28px 16px 40px}
h2{font-size:24px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cat{display:block;padding:18px;background:var(--sf);border:1px solid var(--ln);border-top:4px solid var(--teal);border-radius:6px;text-decoration:none}
.cat:hover{border-top-color:var(--gold)}
.cat b{font:700 19px "Noto Serif KR",serif}
.cat span{display:block;color:var(--mu);font-size:14px;margin-top:4px}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.Canon{background:var(--cb);color:var(--cx)}.Proposal{background:var(--pb);color:var(--px)}.Unknown{background:var(--ub);color:var(--ux)}.Conflict{background:var(--xb);color:var(--xx)}
.Rejected{background:transparent;color:var(--mu);border:1px dashed var(--mu)}
a.btn{display:inline-block;text-decoration:none}
.btn2{padding:10px 16px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:500 15px "Noto Sans KR",sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn2.dg{color:var(--xx);border-color:var(--xx)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;align-items:center}
.fm label,.fm fieldset{display:block;margin:14px 0}.fm label{font-weight:500;font-size:15px}
.fm input,.fm textarea,.fm select{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink);font:inherit}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.srow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:8px;margin-bottom:8px}.srow input,.srow select{margin-top:0!important}.srow .cs{grid-column:1/-1}
.flash{max-width:1000px;margin:14px auto 0;padding:10px 16px;border-left:4px solid var(--teal);background:var(--sf);border-radius:4px}
.flash.warn,.note.err{border-left-color:var(--xx)}
.df{display:grid;grid-template-columns:80px 1fr 1fr;gap:8px;margin:6px 0;font-size:14px}.df div{white-space:pre-line;padding:4px 8px;border-radius:4px;word-break:break-word}
.bf{background:var(--xb)}.af{background:var(--cb)}
.lg{border-top:1px solid var(--ln);padding:8px 0;font-size:14px}
textarea.big{width:100%;min-height:150px;font:13px/1.5 monospace;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink)}
@media (max-width:560px){.df{grid-template-columns:1fr}.srow{grid-template-columns:1fr}}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.sum div{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:10px 16px;min-width:120px}
.sum strong{display:block;font:700 26px "Noto Serif KR",serif}
.note{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--gold);padding:12px 16px;border-radius:4px;color:var(--mu);font-size:15px;margin:14px 0}
.item{display:block;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:14px 18px;margin-bottom:10px;text-decoration:none}
.item:hover{border-color:var(--gold)}
.item h3{margin:0 0 6px;font-size:18px}
.item p{margin:0;color:var(--mu);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{padding:5px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:500 14px "Noto Sans KR",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--ivory);border-color:var(--navy)}
.crumb{font-size:14px;color:var(--mu);margin-bottom:10px}
.claim{white-space:pre-line;background:var(--sf);border:1px solid var(--ln);padding:16px 20px;border-radius:6px;font-family:Georgia,"Noto Serif KR",serif;font-size:17px}
.box{border:1px solid var(--ln);border-radius:6px;padding:14px 18px;margin:16px 0;background:var(--sf)}
.box h3{margin:0 0 8px;font-size:16px}
.box ul{margin:0;padding-left:20px}
.lc{font-size:13px;color:var(--mu);word-break:break-all}
.tags span{display:inline-block;margin:0 6px 6px 0;padding:0 8px;border:1px solid var(--ln);border-radius:4px;font-size:13px;color:var(--mu)}
footer{border-top:2px solid var(--gl);background:var(--sf)}
footer .in{max-width:1000px;margin:auto;padding:24px 16px 32px;color:var(--mu);font-size:14px}
@media (max-width:560px){.hero{padding:40px 16px 36px}.sb{flex-direction:column}}
</style>
</head>

const SEED=[{"id":"harat-square-axial-plan","t":"하랏(Harat)의 평면 구성","c":"architecture","s":"Canon","v":1,"claim":"Harat’s creator-provided design is square-based, organized on straight axes, and symmetrical. A rectangular base is occasionally allowed but not commonly used. Circularized generated versions were assistant-generated embellishments and are not evidence for the original design.","src":[["chat-village-architecture-branch","Turn dated 2026-09-07; user correction and assistant acknowledgement, source messages 365a9038-75b9-4c95-bff1-749306de60d2 and 6407b0af-f740-42b1-81aa-71e9ab2f88dc"],["creator-decisions-2026-11-07","작성자 답변: “직사각형 때로 허용 자주쓰진 않지만”"]],"tags":["architecture","temple","creator-correction"],"conf":[["Square-based plan","chat-village-architecture-branch"],["정사각형 또는 직사각형 기단","source-docx-architecture"]],"res":"정사각형이 기본, 직사각형은 가끔 허용(자주 쓰지 않음). 작성자 결정, 2026-11-07."},{"id":"ranked-mens-garment-volume","t":"계급과 남성 하의의 길이","c":"clothing","s":"Canon","v":1,"claim":"Men’s lower garments become longer and use more fabric (more layering) as social rank increases.","src":[["chat-village-architecture","User message c9c907ee-81b6-413d-b3d0-f422cdc9579d"],["creator-decisions-2026-11-07","작성자 결정: 계급이 높을수록 길어지는 것 확정"]],"tags":["clothing","social-rank"],"dec":"작성자 직접 결정(2026-11-07). 이 규칙 한 줄만 확정했고, 의복 자료의 나머지 남성 복식 항목은 검토 대기입니다."},{"id":"sutari-metal-bars","t":"Sutari (금속 건반 악기)","c":"music","s":"Canon","v":1,"claim":"Sutari is described as an instrument with metal bars; Demung is cited as its closest timbral comparison.","src":[["chat-worldbuilding-agent","User message 66fe0c5b-6755-4b91-8e2b-e3acc757f067 and preceding comparison discussion"]],"tags":["music","instrument"]},{"id":"surala-wood-bars","t":"Surala (나무 건반 악기)","c":"music","s":"Canon","v":1,"claim":"Surala is described as having wooden bars and being similar or nearly identical to a ranat; it is said to be more commonly used than Sutari.","src":[["chat-worldbuilding-agent","User messages 01b90ed5-b32 source-docx-culture","자료.docx › 악기/음악 › music_style, music_genres"]],"tags":["music","genre"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"instr-surala-sutari","t":"Surala와 Sutari의 연주와 음색","c":"music","s":"Proposal","v":2,"claim":"Surala(목재 실로폰): 여러 개의 나무 음판을 타격용 채로 연주하며 곡선형으로 배열된 음판으로 선율을 연주한다. 부드럽고 따뜻하며 맑은 목재 공명음. 궁중 합주의 주선율, 의식 음악, Temaru와 선율을 주고받는 연주에 쓰이며 전투 음악에서는 필요에 따라 보조 선율을 맡는다.\nSutari(금속 실로폰): 금속 음판을 타격용 채로 연주하며 짧고 반복적인 음형과 서로 맞물리는 리듬을 연주한다. 밝고 선명하며 울림이 있는 금속성 음색으로 Surala보다 날카롭고 긴장감 있는 인상. 전투·시험 음악의 핵심 리듬과 선율, 주술적이고 신비로운 분위기의 음악에 쓰인다.\n(재료와 사용 빈도는 기존 Sutari/Surala 항목 참고)","src":[["source-docx-culture","자료.docx › 악기/음악 › instruments › Surala, Sutari"]],"tags":["music","instrument"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"instr-temaru","t":"Temaru (목관 피리)","c":"music","s":"Proposal","v":2,"claim":"입으로 불어 연주하는 목관 피리. 호흡과 운지로 선율과 장식음을 표현한다. 숨결이 섞인 부드럽고 자연스러운 음색으로 중고음역을 중심으로 한다. 바람의 이미지를 상징하는 주요 관악기. 궁중 합주에서는 Surala의 선율을 장식하고, 전투·시험 음악에서는 빠르고 역동적인 연주로 긴장감을 만든다. 곡의 도입부 자유로운 독주, 절정의 고음역 장식음과 빠른 연속음도 연주한다.","src":[["source-docx-culture","자료.docx › 악기/음악 › instruments › Temaru"]],"tags":["music","instrument","canon-candidate"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"자료가 단정적으로 서술한 ‘Canon 후보’입니다. 작성자 확인 후 Canon으로 올립니다."},{"id":"instr-ohi-garun","t":"Ohi-garun (저음 관악기)","c":"music","s":"Proposal","v":2,"claim":"입으로 불어 낮은 음을 지속하거나 길게 연주하는 저음 관악기. 재료는 미정이다. 깊고 웅장하며 울림이 긴 저음으로 불과 용의 목소리를 연상시킨다. 불의 힘을 의미하며 궁중 합주에서 저음의 기반과 신비로운 분위기를 담당한다(도입부 저음 드론, Temaru 뒷받침).","src":[["source-docx-culture","자료.docx › 악기/음악 › instruments › Ohi-garun"]],"tags":["music","instrument"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"instr-moka-garun","t":"Môka-garun (양면 북)","c":"music","s":"Proposal","v":2,"claim":"가로로 놓인 양면 북의 양쪽을 손으로 연주한다. 묵직하고 깊은 저음과 건조한 중저음 타격으로 반복적인 리듬에 추진력을 준다. 땅의 힘, 땅의 심장 박동을 상징하며 일반 합주와 전투 음악 모두에서 리듬 기반을 형성한다. 북의 재료와 세부 제작 방식은 미정이다.","src":[["source-docx-culture","자료.docx › 악기/음악 › instruments › Môka-garun"]],"tags":["music","instrument"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"instr-takataka","t":"Takataka (목제 클라퍼)","c":"music","s":"Proposal","v":2,"claim":"한 쌍의 나무 막대를 서로 부딪쳐 연주한다. 날카롭고 선명하며 짧게 끊기는 목재 타격음. 의식의 시작과 끝, 악절의 구분을 알려 주며 음악의 흐름을 정리하고 중요한 순간을 강조한다.","src":[["source-docx-culture","자료.docx › 악기/음악 › instruments › Takataka"]],"tags":["music","instrument","canon-candidate"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"자료가 단정적으로 서술한 ‘Canon 후보’입니다. 작성자 확인 후 Canon으로 올립니다."},{"id":"instr-kunga","t":"Kunga (금속 징)","c":"music","s":"Proposal","v":2,"claim":"타격하여 중저음의 울림을 만드는 금속 징. 중저음의 묵직한 금속 타격음으로, 깊고 긴 저음이 지속되는 대형 징보다는 짧은 리듬 강조와 악절 구분에 적합하다. 전투·시험 음악에서 중요한 순간과 리듬의 전환을 강조하며 동남아시아의 Kempul과 유사한 음악적 역할을 가진다.","src":[["source-docx-culture","자료.docx › 악기/음악 › instruments › Kunga"]],"tags":["music","instrument","canon-candidate"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"자료가 단정적으로 서술한 ‘Canon 후보’입니다. 작성자 확인 후 Canon으로 올립니다."},{"id":"music-patala-swarga","t":"Patala와 Swarga","c":"music","s":"Proposal","v":2,"claim":"Patala는 인도 문화권의 지하세계 개념에서 유래한 요소로 Surala 및 펜타토닉 음악 계열과 연관된다. 단순히 악이나 어둠을 의미하지 않으며 니에코라 고유의 예술적 해석을 반영한다. Swarga는 원래 천상계와 관련된 개념이며 Sutari 및 펠로그 음악 계열과 연관된다. 니에코라에서는 공허하고 주술적이며 으스스한 장소나 분위기를 연상시키는 방향으로 의미가 변형될 수 있다. 둘의 구분은 단순한 선악이나 지하와 천상의 대립이 아니다.","src":[["source-docx-culture","자료.docx › 악기/음악 › cosmological_concepts, art_and_music"]],"tags":["music","cosmology","scale"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"music-ceremonial-use","t":"의례에서의 음악 사용","c":"music","s":"Proposal","v":2,"claim":"궁중 의식과 전통 의례에서 궁중 합주를 사용한다. 전투·시험 및 공동체 구성원으로 인정받는 의식에서 역동적인 합주를 사용한다. Takataka로 의식의 시작과 끝, 악절을 구분한다. 주술적·신비로운 분위기를 표현하는 음악에서 Sutari를 활용한다.","src":[["source-docx-culture","자료.docx › 악기/음악 › performance_contexts › ceremonial"]],"tags":["music","ritual"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"music-master-instruments","t":"주요 악기 3종","c":"music","s":"Proposal","v":2,"claim":"Surala: 전통적이고 일반적으로 널리 사용되는 주요 악기. Sutari: 펠로그 계열 음악과 전투·시험 음악에서 중요한 금속 악기. Temaru: 궁중 및 전투 합주에서 주요 선율을 담당하는 관악기.","src":[["source-docx-culture","자료.docx › 악기/음악 › master_instruments"]],"tags":["music","instrument"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"music-performance-open","t":"축제·일상 연주 (미정)","c":"music","s":"Unknown","v":2,"claim":"구체적인 축제별 음악과 악기 편성은 아직 미정이다. 일상적인 연주 방식과 대중 음악의 세부 형태는 미정이다.","src":[["source-docx-culture","자료.docx › 악기/음악 › performance_contexts › festivals, daily_use"]],"tags":["music","open-question"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"music-notation-learning","t":"악보 표기와 음악 교육 (미정)","c":"music","s":"Unknown","v":2,"claim":"악보 표기 체계는 아직 확정되지 않았다. 작곡 초안에서는 MIDI와 음표 표기를 활용했으며 펜타토닉 및 펠로그 계열의 음계를 구분하여 사용한다. 악기별 정식 교육 과정, 연주자 양성 체계, 음악 교육 기관 및 구전 교육의 구체적인 방식은 아직 설정되지 않았다.","src":[["source-docx-culture","자료.docx › 악기/음악 › notation_system, learning_process"]],"tags":["music","open-question"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 2, 2026-09-26~2026-10-01 및 2026-11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"hist-origin-date","t":"건국 시기","c":"history","s":"Proposal","v":2,"claim":"건국 시기는 약 12~13세기경이다. 정확한 연도는 미정이다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › origin_story › creation_date"]],"tags":["history","origin"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-origin-place","t":"건국 장소: 지하세계에 해당하는 공간","c":"history","s":"Proposal","v":2,"claim":"건국 장소는 지하세계에 해당하는 별도의 공간이며, 지상과 연결되는 통로가 존재한다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › origin_story › creation_place"]],"tags":["history","origin"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-passage-location","t":"지상 쪽 통로의 위치","c":"history","s":"Unknown","v":2,"claim":"지상 쪽 통로의 위치는 보르네오섬 인근 말레이시아가 후보이나 최종 확정되지 않았다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › origin_story › creation_place, current_state › territory"]],"tags":["history","origin","open-question"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"hist-founders-motive","t":"건국 주체와 동기","c":"history","s":"Proposal","v":2,"claim":"건국 주체는 나가족과 가루다족, 그리고 지상에서 이주한 일부 인간들이다. 전쟁과 사회적 혼란으로 고통받던 사람들을 구하고 지상의 혼란에서 벗어나 살아갈 새로운 공동체를 만들기 위해 건국했다는 설정이 유력하다. 나가족이 인간들에게 직접 나타나 구원했다는 기원 이야기도 검토되었다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › origin_story › creator, motivation"]],"tags":["history","origin"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-initial-state","t":"초기 니에코라의 모습","c":"history","s":"Proposal","v":2,"claim":"초기 니에코라는 지상에서 도망치거나 추방된 사람들을 받아들이는 피난처였다. 나가족은 건국의 주체이자 공동체의 보호자였으며, 초기 사회에는 다양한 출신의 사람들이 공존했다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › origin_story › initial_state"]],"tags":["history","origin"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-era-1-2","t":"시대 1~2: 건국 이전과 건국·초기 정착기","c":"history","s":"Proposal","v":2,"claim":"1. 건국 이전과 나가족의 등장(12~13세기 이전, 시기 미정): 지상에서 전쟁과 사회적 혼란이 발생한다. 나가족이 고통받는 인간들에게 나타나 도움을 주었다는 기원 이야기가 존재한다. 인간 일부가 나가족과 함께 새로운 세계를 건설한다.\n2. 건국과 초기 정착기(약 12~13세기경): 나가족, 가루다족, 인간들이 함께 니에코라를 건설하고, 지상에서 벗어나려는 사람들을 받아들이는 피난처로 기능한다. 나가족은 건국 이념을 수호하고 공동체의 질서를 유지하는 역할을 맡는다. 초기 건축과 문화에 동남아시아 및 크메르 문명, 인도 신화의 영향을 반영한다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › timeline › 1, 2"]],"tags":["history","era"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07 / 건국 기원·나가족 설정, 건국 시기와 건축 양식 논의. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-era-3","t":"시대 3: 정착 확대와 문화 발전기","c":"history","s":"Proposal","v":2,"claim":"(건국 이후 수세기) 지상에서 자발적으로 이주하거나 추방된 사람들이 정착하고, 서로 다른 출신의 사람들이 하나의 사회를 형성한다. 니에코라 고유의 문자와 음악, 의복, 건축, 종교적 전통이 발전한다. 나가족의 수명과 관련된 특별한 생명 연장 약물이 사회적으로 중요한 의미를 갖는다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › timeline › 3"]],"tags":["history","era"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-era-4","t":"시대 4: 계급사회와 상호 견제 체계","c":"history","s":"Proposal","v":2,"claim":"(건국 이후 중세 및 근현대 이전, 시기 미정) 니에코라에 계급과 권력 구조가 형성된다. 계급 자체를 완전히 폐지하기보다는 계층 간 상호 견제와 비교적 자유로운 계급 이동을 추구한다. 나가족이 감시와 견제에 직접 참여하며 권력자의 부패와 착취를 억제한다. 공동체를 심각하게 해치는 부패한 권력자는 추방할 수 있다는 원칙이 발전한다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › timeline › 4"]],"tags":["history","era"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07 / 2026-10-13 나가족의 감시와 견제 참여 논의. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-era-5","t":"시대 5: 건국 이념의 변질과 지상 인식 변화","c":"history","s":"Proposal","v":2,"claim":"(수세기에 걸친 변화) 초기 이주민의 후손들은 지상에서의 고통을 역사와 전통을 통해 배운다. 세대가 바뀌면서 지상에 대한 직접적인 경험은 줄고 부정적인 인식이 일부 사회에 정착한다. 피난처가 점차 외부인을 경계하는 폐쇄적인 사회로 변할 가능성이 생기고, 건국 당시의 구원 정신과 후대의 배타적인 해석 사이에 차이가 발생한다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › timeline › 5"]],"tags":["history","era"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-story-modern","t":"시대 6~7 (본편 이전): 지상과의 접촉, 왕의 실각","c":"history","s":"Proposal","v":2,"claim":"6. (이야기 본편 이전 수년) 니에코라의 존재가 지상에 알려지고 일부 지상인들이 존재와 생명 연장 약물에 관심을 갖는다. 왕이 지상을 방문하거나 사절단을 보내 실제 상황을 확인한다는 설정이 검토되었다. 왕은 내부 반대에도 생명 연장 약물을 지상인들에게 판매하고, 존재가 더 널리 알려져 대규모 이주 움직임이 발생한다.\n7. (본편 직전 및 초반) 내부 반발이 커지고 왕은 대규모 이주를 제대로 관리하지 못해 실각하거나 추방된다. 지상에서는 AI 기술의 혜택이 소수의 부유층에 집중되고 불평등이 심화되어 니에코라를 새로운 피난처로 여기는 사람들이 늘며, 부유층과 권력자들은 니에코라를 차지할 대상으로 바라보기 시작한다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › timeline › 6, 7"]],"tags":["history","era","story-plot"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07 / 왕의 지상 방문과 약물 판매, 지상의 AI 불평등, 왕의 실각 논의. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-story-main","t":"시대 8~9 (본편): 서준과 삼총사, 통로 붕괴","c":"history","s":"Proposal","v":2,"claim":"8. 서준은 지상의 어려운 취업 상황을 벗어나 동남아시아로 향한다. 필리핀에서는 기회를 얻기 어렵고(관광 안내나 통로 주변 조사 같은 일자리를 알아보는 설정이 제안됨), 이후 말레이시아까지 이동하며 니에코라 소문을 다시 접한다. 서준은 니에코라에서 임시 지도자이자 전사로 활동하며 ‘테마 웰란’이라는 칭호를 얻는다. 민준, 유나, 지훈은 지상에 남아 생존을 모색하다가 서준을 찾고 군중과 함께 이주 움직임에 참여한다.\n9. (본편 후반) 대규모 지상인들이 통로 주변에 모여 부유층과 일반 이주민 사이에 충돌과 혼란이 발생한다. 니에코라는 양측을 모두 통제하려 하고, 통로가 붕괴하며 문제가 심각해진다. 니에코라는 자신들도 과거 지상의 혼란과 억압에서 벗어난 이들의 후손임을 설명하고, 서준과 삼총사는 사태의 평화로운 해결에 기여한다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › timeline › 8, 9"]],"tags":["history","era","story-plot"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07 / 2026-10-26 서준의 이동 경로, 2026-10-11 본편 후반 구상. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-story-ending","t":"시대 10: 새로운 공존의 가능성 (구상 단계)","c":"history","s":"Proposal","v":2,"claim":"니에코라와 지상은 서로의 사회적 문제와 한계를 인정한다. 니에코라는 지상의 일부 지역에 제한적인 방문을 허용하는 방안을 검토한다. 서준과 삼총사는 평화로운 공존을 위한 노력의 상징적인 인물로 자리한다. 서준은 생명 연장 약물을 들고 개인의 장수와 사회의 지속 가능성을 연결하는 메시지를 전한다. 후속 이야기 여부도 미정이다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › timeline › 10, evolution_stages"]],"tags":["history","era","story-plot"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07 / 2026-10-11 결말과 약물의 상징성 논의. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-drug-decision","t":"서준의 약물 복용 여부","c":"history","s":"Unknown","v":2,"claim":"서준이 생명 연장 약물을 복용할지는 아직 결정되지 않았다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › timeline › 10"]],"tags":["history","story-plot","open-question"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"hist-population","t":"인구 (미정)","c":"history","s":"Unknown","v":2,"claim":"정확한 인구수는 미정이다. 나가족, 가루다족, 인간 및 여러 출신의 후손들이 함께 살아가는 사회다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › current_state › population"]],"tags":["history","open-question"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"hist-culture-status","t":"현재의 문화 상태","c":"history","s":"Proposal","v":2,"claim":"동남아시아와 크메르 문명, 인도 신화에서 영감을 받은 독자적인 문화가 발전했다. 고유 문자, 음악, 의복, 건축, 종교적 유산을 보유한다. 현대에는 전통과 건국 이념의 변질, 외부인 수용 문제를 둘러싼 갈등이 존재한다.","src":[["source-docx-culture","자료.docx › 스토리/역사 › current_state › culture_status"]],"tags":["history"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"hist-themes","t":"이야기의 주제","c":"history","s":"Proposal","v":2,"claim":"피난처로 건설된 문명이 오히려 외부인을 배척하게 되는 역설; AI 기술이 인간을 해방하기보다 소수에게 부를 집중시킬 수 있다는 문제; 계급을 없애는 것과 권력의 부패를 억제하는 것은 서로 다른 문제라는 관점; 나가족의 감시와 견제를 통한 권력 통제; 건국 이념과 후대의 정치적 해석 사이의 차이; 생명 연장 약물이 개인의 장수뿐 아니라 사회의 미래를 상징한다는 점; 지상과 니에코라 중 어느 한쪽도 완벽한 사회가 아니라는 관점; 구원받지 못한 세계에서 온 사람이 피난처의 가치를 되살리려 한다는 역설; 문명의 역사와 이상, 실제 현실 사이의 간극; 서준과 삼총사의 우정 및 서로 다른 삶의 선택","src":[["source-docx-culture","자료.docx › 스토리/역사 › current_state › themes"]],"tags":["history","story-plot"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 3, 2026-10-11·10-13·10-26·11-07. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-style","t":"복식의 성격","c":"clothing","s":"Proposal","v":2,"claim":"동남아시아의 수상 문명과 강·바다 중심 생활에서 영감을 얻은 독자적인 전통 의상이며 특정 현실 문화의 복제를 지향하지 않는다. 주요 특징은 사롱형 랩 하의, 대각선으로 걸치는 어깨천, 정교한 직조 및 바틱풍 문양, 금속 장신구, 청록색과 남색의 조화이다. 주름과 천의 겹침을 아름다움의 중요한 요소로 여기며 사회적 지위에 따라 의상의 길이와 장식의 양이 달라진다.","src":[["source-docx-culture","자료.docx › 의복/장신구 › clothing_style"]],"tags":["clothing"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4, 2026-08-21 계층별 복식. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-fabrics","t":"직물의 종류","c":"clothing","s":"Proposal","v":2,"claim":"전통 직조 직물; 바틱풍 문양 염색 직물; 청록색 및 남색 계열의 염색 천; 크림색과 아이보리색의 가벼운 직물; 금색 및 장식용 테두리가 들어간 고급 직물; 얇고 유연하게 드레이프되는 장식용 천. 정확한 섬유 원료와 직물의 명칭은 미확정이다.","src":[["source-docx-culture","자료.docx › 의복/장신구 › fabric_types"]],"tags":["clothing","fabric"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4 (2026-08-21~2026-10-07). 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-colors","t":"색의 상징","c":"clothing","s":"Proposal","v":2,"claim":"청록색: 강과 바다, 생명의 근원, 니에코라의 대표적인 문화적 정체성. 남색: 전통 직물과 수상 생활의 안정감, 깊은 물. 금색: 권위, 부유함, 귀족적 지위와 신성함. 아이보리 및 크림색: 단정함, 우아함, 청결함. 갈색: 자연, 목재, 실용적인 생활. 적갈색: 전통적인 장식과 직물의 깊이감. 붉은색: 고귀함과 장식적 강조. 녹색: 자연과 생명력.","src":[["source-docx-culture","자료.docx › 의복/장신구 › color_symbolism"]],"tags":["clothing","color"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4, 2026-08-21 평민·중산층·귀족·사제의 색상 차이. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-male","t":"남성 복식","c":"clothing","s":"Proposal","v":2,"claim":"사롱형 랩 하의와 짧은 반바지를 결합한 형태; 허리 앞쪽에서 천을 묶는 구조; 상체에 대각선으로 걸치는 어깨천; 상체를 드러내거나 짧은 상의를 함께 착용; 평민은 짧고 실용적인 하의를 주로 착용; 귀족은 긴 장식용 천과 다층적인 드레이프를 활용. 재료: 남색·청록색 직조 직물, 금색 문양의 바틱풍 직물, 아이보리색 보조 천, 갈색·적갈색 허리띠와 장식용 천. 장신구: 직조 머리띠, 금속 팔찌, 팔 위쪽의 장식용 완장, 목걸이와 구슬 장신구, 허리띠와 장식용 매듭, 샌들, 귀족용 금속 장식 및 보석.\n(계급이 높을수록 길어지는 규칙은 기존 Canon 항목 참고)","src":[["source-docx-culture","자료.docx › 의복/장신구 › gender_differences › male_clothing"]],"tags":["clothing"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4, 2026-08-22, 2026-09-20 남성 사롱형 하의·반바지 구조. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-female","t":"여성 복식","c":"clothing","s":"Proposal","v":2,"claim":"랩 스커트 형태의 하의; 어깨에서 대각선으로 내려오는 드레이프 천; 짧은 상의 또는 가슴을 감싸는 천; 허리 부분에 여러 장의 천을 겹쳐 장식하는 형태; 긴 치마와 풍성한 천의 주름을 활용하는 귀족 복식; 꽃 장식과 머리 장식으로 우아함을 강조. 재료: 청록색·남색 직조 직물, 금색 문양의 장식용 직물, 아이보리색 상의용 천, 적갈색·금색 보조 천, 가볍게 늘어지는 장식용 천. 장신구: 꽃 장식 머리핀, 꽃으로 장식한 올림머리, 금속 귀걸이, 목걸이, 팔찌와 발찌, 금속 완장, 보석 장식, 장식용 허리띠.","src":[["source-docx-culture","자료.docx › 의복/장신구 › gender_differences › female_clothing"]],"tags":["clothing"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4, 2026-08-22 여성 어깨 드레이프와 랩 스커트. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-genderless","t":"성별 구분 없는 복식","c":"clothing","s":"Proposal","v":2,"claim":"대각선 어깨천, 사롱형 랩 직물, 직조 머리띠, 메가멘둥 구름문양이 들어간 장식용 천. 재료는 청록색 직조 직물, 남색 직물, 금색 장식 직물, 아이보리색 보조 직물. 장신구는 구슬 목걸이, 금속 팔찌, 직조 머리띠, 구름 및 물결 문양 장식.","src":[["source-docx-culture","자료.docx › 의복/장신구 › gender_differences › genderless_clothing"]],"tags":["clothing"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4, 2026-08-22 메가멘둥 문양. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-formal-events","t":"의례·행사 복식","c":"clothing","s":"Proposal","v":2,"claim":"귀족은 다층적인 직물과 긴 드레이프, 금실 문양과 정교한 바틱풍 장식을 사용한다. 왕족은 화려한 왕관과 보석 장신구를 착용한다. 고위 사제는 연꽃과 신성한 물을 상징하는 장식을 활용한다. 성스러운 무용수는 대각선 어깨천, 랩 스커트, 꽃과 깃털 장식, 금색 및 청록색 장신구를 활용한다. 전통 축제에서는 꽃과 깃털 장식을 활용할 수 있고, 가면춤과 민속 공연에는 별도의 공연용 복식이 존재할 수 있다.","src":[["source-docx-culture","자료.docx › 의복/장신구 › ceremonial_attire › festivals, formal_events"]],"tags":["clothing","ritual"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4, 2026-10-07 전통 무용수 복식. 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-accessories","t":"장신구 5종","c":"clothing","s":"Proposal","v":2,"claim":"전통 직조 머리띠(직조 직물·금색 장식; 전통성과 문화적 소속감; 평민부터 귀족까지 남녀). 꽃 장식(꽃·장식용 금속; 자연의 아름다움과 우아함; 여성의 일상·의례 복식). 전통 구슬 목걸이(구슬·금속·청록색 장식석; 장식적 아름다움과 지위; 남녀 모두, 귀족은 더 정교한 형태). 금속 완장(황동·금색 금속; 신분과 장식적 권위; 평민과 귀족의 일상·의례 복식). 장식용 허리띠(직조 직물·금속·가죽 또는 끈; 복식의 구조를 잡고 장식적 위엄을 표현; 사롱과 랩 하의 고정).","src":[["source-docx-culture","자료.docx › 의복/장신구 › adornments"]],"tags":["clothing","accessory"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4 (2026-08-21~2026-10-07). 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-patterns","t":"문양 3종: Sena-bula, 연꽃, 나가","c":"clothing","s":"Proposal","v":2,"claim":"Sena-bula(세나-불라): 희망의 구름과 바람의 상징, 직조 및 바틱풍 염색 직물, 평민과 귀족의 의복 및 장식품. 연꽃 문양: 순수함과 번영, 신앙 관련 장식과 귀족·사제 복식. 나가 문양: 수호와 지혜, 금속 세공과 직물 자수, 왕족·사제 및 전통 장신구.","src":[["source-docx-culture","자료.docx › 의복/장신구 › adornments › 문양"]],"tags":["clothing","pattern"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4 (2026-08-21~2026-10-07). 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-crown","t":"니에코라 왕관","c":"clothing","s":"Proposal","v":2,"claim":"금색 금속, 청록색 보석, 진주 장식으로 이루어진다. 왕권과 나가 신앙, 수상 문명의 권위를 상징하며 왕의 즉위 및 공식적인 왕실 행사에 쓰인다. (금색 삼지창은 기존 항목 참고)","src":[["source-docx-culture","자료.docx › 의복/장신구 › adornments › 니에코라 왕관"]],"tags":["clothing","regalia"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4 (2026-08-21~2026-10-07). 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-beauty","t":"아름다움의 기준","c":"clothing","s":"Proposal","v":2,"claim":"의복의 단정한 주름과 자연스러운 드레이프, 직물의 섬세한 문양과 색상 조화, 꽃과 금속 장신구의 조화, 머리 장식과 헤어스타일의 정교함, 자연과 조화를 이루는 우아한 외형을 가치 있게 여긴다. 올림머리와 꽃 장식, 직조 머리띠, 금속 장신구와 보석으로 꾸민다.","src":[["source-docx-culture","자료.docx › 의복/장신구 › beauty_standards"]],"tags":["clothing"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4 (2026-08-21~2026-10-07). 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"cloth-open","t":"혼례복·신체 개조·계절 복식 (미정)","c":"clothing","s":"Unknown","v":2,"claim":"결혼식 전용 복식의 구체적인 형태는 아직 미확정이며 기존 귀족 복식과 금색·꽃 장식을 활용할 가능성이 있다. 신체 개조 및 문신의 구체적인 문화적 관습은 미확정이다. 계절별 의복 체계는 아직 확립되지 않았다.","src":[["source-docx-culture","자료.docx › 의복/장신구 › ceremonial_attire › wedding, beauty_standards, seasonal_variations"]],"tags":["clothing","open-question"],"lg":"ko","hint":"자료.docx의 출처 단서: chat_id 4 (2026-08-21~2026-10-07). 자료.docx의 출처 표기는 chat_id 번호뿐이라 어느 대화인지 연결되지 않았습니다. (연결 미확인)","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"soc-hierarchy","t":"사회 계층 구조","c":"society","s":"Proposal","v":2,"claim":"왕을 중심으로 귀족, 고위 사제, 상인 및 장인 계층, 평민 등이 존재하는 계층 사회이다. 상인과 장인 중 일부는 중간 귀족에 가까운 지위를 갖는다. 나가와 가루다는 건국에 참여한 종족으로서 특별한 역사적·종교적 권위를 지닌다. 권력은 한곳에 집중되지 않도록 견제와 균형을 중시하며 부패하거나 부적절한 권력자는 지위에서 축출될 수 있다. 나가들도 통치와 권력 감시에 참여한다.","src":[["source-docx-culture","자료.docx › 관습/의례 › social_structure › hierarchy"]],"tags":["society"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"soc-roles","t":"계층별 역할","c":"society","s":"Proposal","v":2,"claim":"왕: 정치와 행정을 총괄하고 국가의 안정과 번영을 책임진다. 건국설화와 미래 예언을 바탕으로 지상의 상황을 관찰하고 장기 정책을 검토하며, 필요하면 사절단이나 상인으로 위장한 조사 인원을 파견한다.\n고위 사제: 나가와 관련된 종교적 전통과 의례를 담당하고 건국설화와 예언 문헌을 보존·해석하며 나가와 인간 사회 사이의 종교적 관계를 유지한다.\n귀족: 국가 운영과 행정에 참여하고 지역사회와 주요 시설을 관리하며 왕권을 견제하는 역할을 수행할 수 있다.\n상인 및 장인: 생산·유통·교역을 담당하고 문화와 기술 발전에 기여하며, 일부 고위 상인은 외국 상인이나 사절단의 형태로 지상을 조사한다. 일부는 경제적 능력과 사회적 공헌으로 중간 귀족에 가까운 지위를 얻는다.\n평민: 농업, 어업, 수공업, 서비스업 등에 종사하고 일상적인 경제활동을 유지하며 축제와 문화행사에 참여한다.\n나가 및 가루다: 건국의 역사적·종교적 유산을 계승한다. 나가들은 인간 사회의 보호와 국가 운영에 참여하고 부패를 감시·견제한다. 가루다는 나가와 함께 건국과 보호에 참여한 종족으로 기억된다.","src":[["source-docx-culture","자료.docx › 관습/의례 › social_structure › roles"]],"tags":["society"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"soc-role-requirements","t":"신분 요건 (미설정)","c":"society","s":"Unknown","v":2,"claim":"왕위 계승 및 선출 방식, 고위 사제의 선발 기준과 교육 과정, 가문·공적·임명 등 귀족 지위 획득 방식, 평민의 신분 요건, 종족별 사회적 지위와 구체적인 직책 체계는 아직 설정되지 않았다.","src":[["source-docx-culture","자료.docx › 관습/의례 › social_structure › roles › requirements"]],"tags":["society","open-question"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"soc-lifespan","t":"수명과 코라-루와 (kora-ruwa)","c":"society","s":"Proposal","v":2,"claim":"니에코라인은 수명 연장 약물인 코라-루와(kora-ruwa)의 영향으로 지상 인간보다 긴 수명을 누린다. 평균 수명은 약 200년 정도로 설정되어 있으나 개인차가 존재한다.","src":[["source-docx-culture","자료.docx › 관습/의례 › age_groups"]],"tags":["society","lifespan"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"soc-family-age","t":"가족 구조와 연령 구분 (미설정)","c":"society","s":"Unknown","v":2,"claim":"가족의 구성 방식, 친족 관계, 혼인 후 거주 형태, 상속 및 가계 계승 방식은 아직 구체적으로 설정되지 않았다. 다양한 지상 출신 조상의 후손들이 함께 살아왔으므로 여러 문화적 가족 전통이 존재할 가능성이 있다. 연령 집단(어린이, 청소년, 성인, 노년층)의 정확한 구분과 성년 기준은 설정되지 않았다.","src":[["source-docx-culture","자료.docx › 관습/의례 › family_structure, age_groups"]],"tags":["society","open-question"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"soc-work","t":"생업과 일","c":"society","s":"Proposal","v":2,"claim":"농업, 어업, 상업, 장인업 등 다양한 생업이 존재한다. 상인과 장인은 경제와 문화 발전에 중요한 역할을 한다. 일부 고위 상인은 지상의 상황을 확인하기 위한 비밀 조사 활동에 참여한다. 국가 운영은 권력 견제와 균형을 중시한다.","src":[["source-docx-culture","자료.docx › 관습/의례 › daily_customs › work_practices"]],"tags":["society"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"soc-daily-open","t":"일상 습관·식사·관계 (미설정)","c":"society","s":"Unknown","v":2,"claim":"아침 기상과 의례, 일상적인 종교 활동과 기도 방식, 저녁의 가족 활동·여가·공동체 모임, 식사 예절·시간·음식의 종류는 아직 설정되지 않았다. 우정의 표현 방식, 가족 간 유대와 세대 간 관계, 연애와 혼인에 관한 사회적 관습도 설정되지 않았다. 지상에서 이주한 여러 민족의 후손이 있어 다양한 음식 문화가 형성되었을 가능성이 있다.","src":[["source-docx-culture","자료.docx › 관습/의례 › daily_customs, relationship_dynamics"]],"tags":["society","open-question"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"soc-fest-founding","t":"건국 기념 의례","c":"society","s":"Proposal","v":2,"claim":"나가와 가루다, 인간이 함께 니에코라를 세운 역사와 건국의 의미를 기념한다. 나가를 상징하는 깃발과 가루다를 상징하는 깃발을 사용하고 건국설화와 관련된 역사적 이야기를 전승하며, 나가와 가루다의 협력과 서약을 상징하는 행사가 열릴 수 있다. 참가자는 나가, 가루다, 인간을 포함한 주민이다. 정확한 날짜와 기간은 설정되지 않았다.","src":[["source-docx-culture","자료.docx › 관습/의례 › festivals › 나가와 가루다의 건국 기념 의례"]],"tags":["society","festival"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"soc-fest-mask","t":"전통 가면춤 및 풍자 공연","c":"society","s":"Proposal","v":2,"claim":"조상들의 종교적·문화적 유산을 보존하면서 과거의 신앙과 인간 사회를 풍자하고 비판적으로 되돌아본다. 나무와 다양한 재료로 만든 가면을 쓰고 힌두교, 불교, 이슬람교 등 지상 조상들이 믿었던 종교의 전승을 소재로 삼는다. 인간의 기도에 응답하지 않았다고 여겨지는 지상의 신들을 간접적으로 풍자하고, 자신을 버린 존재·배신자·무책임한 권력자 등을 익살스러운 가면으로 표현한다. 동남아시아에서 전해진 전설 속 인물이나 괴물, 오만·배신·두려움 같은 인간의 약점을 상징하는 가면도 쓴다. 날짜와 정기 개최 여부는 설정되지 않았다.","src":[["source-docx-culture","자료.docx › 관습/의례 › festivals › 전통 가면춤 및 풍자 공연"]],"tags":["society","festival"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"soc-life-events","t":"통과의례 (미설정)","c":"society","s":"Unknown","v":2,"claim":"출생 축하 의식과 명명식, 성년식과 성년의 기준, 혼례의 절차와 혼인 규범, 장례식과 추모 의례, 매장·화장 등 장례 방식은 아직 설정되지 않았다. 평균 수명이 약 200년인 사회이므로 장수와 죽음에 관한 독특한 문화가 존재할 가능성이 있으나 구체적인 관습은 미정이다.","src":[["source-docx-culture","자료.docx › 관습/의례 › life_events"]],"tags":["society","open-question"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."},{"id":"soc-rule-balance","t":"규칙: 권력의 견제와 균형","c":"society","s":"Proposal","v":2,"claim":"왕과 귀족 등 권력자가 부패하거나 사회에 해를 끼치는 일을 방지하기 위한 원칙이다. 권력 감시와 견제 체계가 존재하며 부패하거나 부적절한 권력자는 직위에서 축출될 수 있고, 나가들도 감시와 견제에 참여한다. 구체적인 예외 및 축출 절차는 설정되지 않았다.","src":[["source-docx-culture","자료.docx › 관습/의례 › social_rules › 권력의 견제와 균형"]],"tags":["society","rule"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"soc-rule-prophecy","t":"규칙: 건국설화와 예언의 해석","c":"society","s":"Proposal","v":2,"claim":"건국 문헌에는 인류가 멸망하기 직전 지상 사람들이 니에코라로 피신해 대대로 보금자리를 삼을 것이라는 예언이 기록되어 있으나, 어떤 방식으로 문을 열게 될지는 확정할 수 없다고 명시되어 있다. 예언에 대한 단일하고 확정적인 해석은 없으며 후대의 나가와 인간들은 서로 다른 해석을 내놓을 수 있다. 나가들 사이에서도 미래 계획에 대한 의견 차이가 존재한다.","src":[["source-docx-culture","자료.docx › 관습/의례 › social_rules › 건국설화와 예언의 해석"]],"tags":["society","rule"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"soc-rule-secrecy","t":"규칙: 지상과의 관계에 대한 비밀 유지","c":"society","s":"Proposal","v":2,"claim":"건국 초기에는 지상의 종교 및 권력과 충돌하거나 박해받을 가능성 때문에 존재를 공개하지 않는 방향이 선택되었다. 초기 나가들은 존재가 알려지지 않도록 했으며 초대 이주를 거부한 사람들의 기억을 지우는 설정도 존재한다. 후대 왕들은 지상을 조사할 때 상인 등으로 위장하기도 하고, 일부 왕들은 비밀리에 지상을 방문하거나 조사단을 파견했다. 이들의 존재는 지상에서 때때로 미스터리나 전설로 남는다.","src":[["source-docx-culture","자료.docx › 관습/의례 › social_rules › 지상과의 관계에 대한 비밀 유지"]],"tags":["society","rule"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"soc-rule-ancestor-religion","t":"규칙: 조상 종교 유산의 보존과 비판","c":"society","s":"Proposal","v":2,"claim":"니에코라인들은 조상들이 지상에서 믿었던 종교의 신들이 인간에게 관심을 보이지 않았다고 생각하지만, 조상들의 종교적 문화유산 자체를 완전히 없애지는 않는다. 전통 가면춤과 풍자 공연을 통해 과거의 종교와 신앙을 간접적으로 비판하면서 문화유산으로 보존한다. 모든 주민이 이러한 관점에 동의하는 것은 아닐 수 있다.","src":[["source-docx-culture","자료.docx › 관습/의례 › social_rules › 조상 종교 유산의 보존과 비판"]],"tags":["society","rule"],"lg":"ko","hint":"자료.docx의 이 영역에는 출처 표기(chat_id)가 없습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-identity","t":"건축의 기본 정체성","c":"architecture","s":"Proposal","v":2,"claim":"동남아시아, 특히 크메르·자바를 비롯한 여러 지역의 건축문화에서 출발하되 특정 국가의 양식을 그대로 가져오지 않고 여러 요소를 재구성해 새로운 양식으로 만드는 방향이다. 건축 형태는 사각형 기단과 계단식 구조, 공간 구성은 중앙축과 좌우대칭, 지붕은 층층이 상승하는 탑과 장식적인 지붕, 장식은 나가·연꽃·구름·바람 문양, 재료 이미지는 석재와 목재의 조화, 색채는 자연적인 석재색·갈색·금색·청록색, 자연과의 관계는 연못·열대식물·정원과 건축의 조화이다.","src":[["source-docx-architecture","건축.docx › 1. 니에코라 건축의 기본 정체성"]],"tags":["architecture"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-references","t":"참고한 실제 건축 (설정 아님)","c":"architecture","s":"Proposal","v":2,"claim":"참고 대상: 프람바난(중앙 성소와 여러 작은 성소의 배치), 마하발리푸람(기둥·문틀·벽면·계단의 장식 조각), 앙코르 와트(사각형 기단과 상승 구조, 중앙 성소와 주변 탑의 위계, 회랑, 나가 장식; 현재 가장 중요한 참고 문화 중 하나), 보로부두르(사각형 테라스에서 원형 테라스로 변하는 구조의 참고 사례이며 Harat가 반드시 따를 필요는 없음). 조각 양식은 자바(신화와 역사를 묘사하는 조각), 남인도(조각 자체가 건축의 일부가 되는 방식), 크메르(건축 전체를 이야기의 공간으로 만드는 방식)를 참고 방향으로 든다.","src":[["source-docx-architecture","건축.docx › 2. 실제 건축문화에서 참고한 양식, 5-1"]],"tags":["architecture","reference-not-lore"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-harat-name","t":"Harat(하랏): 사원","c":"architecture","s":"Proposal","v":2,"claim":"Harat(하랏)은 니에코라어로 사원을 뜻한다. 어원은 hara이며 hara는 수호하거나 지킨다는 의미를 가진다. 따라서 단순한 종교시설이 아니라 신성한 존재와 공동체를 보호하는 장소라는 의미를 담는다.","src":[["source-docx-architecture","건축.docx › 3. 니에코라의 사원: Harat"]],"tags":["architecture","harat","canon-candidate"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"자료가 단정적으로 서술한 ‘Canon 후보’입니다. 작성자 확인 후 Canon으로 올립니다."},{"id":"arch-harat-structure","t":"Harat의 기본 구조","c":"architecture","s":"Proposal","v":2,"claim":"기단: 넓은 정사각형 또는 직사각형(기존 Harat 항목: 정사각형이 기본이고 직사각형은 가끔 허용). 중앙 건물: 가장 높고 규모가 큰 중앙 성소. 주변 탑: 중앙을 보조하는 여러 개의 작은 탑. 계단: 중앙 성소로 이어지는 넓고 직선적인 계단. 난간: 나가 형상의 장식. 회랑: 건물을 둘러싸거나 연결하는 공간. 정원: 열대식물과 연못을 활용한 자연 공간. 상부: 여러 단계로 좁아지는 탑과 장식적인 첨탑. (문서는 ‘사원 참고 이미지에서 확인한 요소’라고 하나 그 이미지는 확인되지 않았고, 도식은 개념도이지 확정된 설계도가 아니라고 밝힌다.)","src":[["source-docx-architecture","건축.docx › 3-1. 기본 건축 구조"]],"tags":["architecture","harat"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-harat-tower","t":"Harat의 탑 형태","c":"architecture","s":"Proposal","v":2,"claim":"사원 탑 형태 세 방향 중 현재 Harat의 방향은 ‘앙코르 와트처럼 사각형 기반에서 위로 갈수록 좁아지는 형태’에 가장 가깝다. 원형 요소가 절대 금지되는 것은 아니며 연못이나 장식적인 문양에는 사용할 수 있다. 다만 건축물의 기본 구조는 원형으로 변형되지 않는다.","src":[["source-docx-architecture","건축.docx › 3-2. 탑의 형태와 사각형 구조"]],"tags":["architecture","harat"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-naga-carving","t":"나가 조각의 의미와 위치","c":"architecture","s":"Proposal","v":2,"claim":"Harat에서 나가는 단순한 장식용 동물이 아니라 신성한 장소의 수호자, 사원 입구의 보호자, 신앙과 공동체를 연결하는 존재, 건국의 역사를 기억하게 하는 상징의 의미를 가질 수 있다. 배치 후보는 계단 좌우의 난간, 성소 입구, 기둥의 하단과 상단, 지붕의 가장자리, 외벽의 부조, 연못 주변의 석조 조각이다.","src":[["source-docx-architecture","건축.docx › 3-3. 나가 조각"]],"tags":["architecture","harat","carving"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-lotus-nature","t":"연꽃과 자연의 조화","c":"architecture","s":"Proposal","v":2,"claim":"Harat의 외부 공간에서 연꽃과 물을 활용하는 방향이다. 예: 사원 입구의 연못, 계단 앞의 작은 수경시설, 연꽃을 새긴 바닥 장식, 연못을 둘러싼 석조 난간, 열대식물과 석조 건축이 만나는 정원. 이 공간은 사원을 일상적인 마을과 구별되는 신성한 장소로 만든다.","src":[["source-docx-architecture","건축.docx › 3-4. 연꽃과 자연의 조화"]],"tags":["architecture","harat"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-welora-name","t":"Welora(웰로라): 왕궁","c":"architecture","s":"Proposal","v":2,"claim":"왕궁은 니에코라어로 Welora(웰로라)라고 한다. Harat가 수호와 신앙을 중심으로 하는 공간이라면 Welora는 정치와 통치, 외교와 왕실 생활의 중심이다.","src":[["source-docx-architecture","건축.docx › 4. 니에코라의 왕궁: Welora"]],"tags":["architecture","welora","canon-candidate"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"자료가 단정적으로 서술한 ‘Canon 후보’입니다. 작성자 확인 후 Canon으로 올립니다."},{"id":"arch-welora-form","t":"Welora의 높이와 공간 구성","c":"architecture","s":"Proposal","v":2,"claim":"고층형과 저층 광역형 중 현재까지 발전시킨 방향은 저층 광역형을 기본으로 하되 중앙 건물만 높게 만드는 혼합형이다(문서는 이를 ‘중요한 결정’이라 표현한다). 권장 구성: 중앙 왕궁 2~3층(왕실의 중심 공간), 좌우 전각 1~2층(행정·접견·의례), 외부 회랑(낮고 길게, 건물 연결), 중정(개방형, 행사와 집회), 정원(넓은 자연 공간), 연못(선택적 배치).","src":[["source-docx-architecture","건축.docx › 4-1, 4-2"]],"tags":["architecture","welora"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-welora-exterior","t":"Welora의 외관","c":"architecture","s":"Proposal","v":2,"claim":"Harat보다 목재의 존재감을 강조하는 방향이다. 짙은 갈색 목재, 금색 장식, 석재 기단, 조각된 기둥, 층층이 겹쳐지는 지붕, 나가와 연꽃 장식, 구름과 바람 문양. 중앙 왕궁은 주변 전각보다 높고 화려하게 만들되, 높이만이 아니라 넓은 중정과 회랑, 정교한 장식, 건축물의 배치도 권위를 표현한다.","src":[["source-docx-architecture","건축.docx › 4-3. 왕궁의 외관"]],"tags":["architecture","welora"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-compare","t":"Harat와 Welora의 차이","c":"architecture","s":"Proposal","v":2,"claim":"Harat: 종교·수호·신성함, 기본 형태 수직적, 중심은 성소와 탑, 신성한 영역, 석재 중심, 장식은 나가·연꽃. Welora: 정치·왕실·통치, 기본 형태 수평적, 중심은 중앙 왕궁, 복합적인 생활공간, 목재와 석재, 장식은 구름·바람·나가·연꽃.","src":[["source-docx-architecture","건축.docx › 4-4. Welora와 Harat의 차이"]],"tags":["architecture","harat","welora"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"작성자 확인 전. 자료의 서술이 유일한 근거입니다."},{"id":"arch-carving-open","t":"니에코라 고유의 조각 문양 (자료 끊김)","c":"architecture","s":"Unknown","v":2,"claim":"문서의 ‘5-2. 니에코라 고유의 조각 문양’은 제목만 있고 내용이 없다. 내용을 확보해야 한다.","src":[["source-docx-architecture","건축.docx › 5-2. 니에코라 고유의 조각 문양"]],"tags":["architecture","open-question"],"lg":"ko","hint":"건축.docx에는 출처 표기가 없고 AI가 대화 내용을 정리한 문서입니다. 확립된 설정과 AI의 제안이 문장 단위로 구분되어 있지 않습니다.","dec":"자료가 미정 또는 미설정으로 표시한 내용입니다."}];

function doAct(ev,id){ev.preventDefault();const why=$("#r-why").value.trim();if(!why){MODE.err="결정 사유를 적어 주세요.";route();return false}const e=cur(id),b=clone(e),n=clone(e),a=MODE.a;

function srow(s,i){const c=s[0].startsWith("custom:"),u=s[0]&&!c&&!SRC[s[0]];return `<div class="srow"><select aria-label="출처" onchange="fsync();route()"><option value="">출처 선택</option>${Object.keys(SRC).map(k=>`<option value="${k}"${s[0]===k?" selected":""}>${esc(SRC[k])}</option>`).join("")}${u?`<option value="${esc(s[0])}" selected>${esc(s[0])}</option>`:""}<option value="custom"${c?" selected":""}>직접 입력</option></select><input class="sl" aria-label="출처 위치" placeholder="위치(문서 쪽수, 메시지 등)" value="${esc(s[1])}"><button type="button" class="btn2" onclick="rmSrc(${i})">삭제</button>${c?`<input class="cs" aria-label="출처 이름" placeholder="출처 이름" value="${esc(s[0].slice(7))}">`:""}</div>`}

<h3>백업</h3><div class="bar"><button class="btn2" onclick="showBk('bk')">복구용 백업 보기</button><button class="btn2" onclick="showBk('all')">현재 전체 항목 JSON 보기</button></div>
${MG.view?`<textarea id="bk" class="big" readonly>${esc(MG.view==="bk"?bk():JSON.stringify(E,null,1))}</textarea><div class="bar"><button class="btn" onclick="copyTA()">전체 선택·복사</button></div>`:""}
<h3>복구</h3>${er}<textarea id="imp" class="big" placeholder="복구용 백업 내용을 여기에 붙여 넣으세요"></textarea><div class="bar"><button class="btn2" onclick="stageImp($('#imp').value)">백업 확인</button></div>
${MG.imp?`<div class="box"><p>이 백업으로 복구하면 지금의 편집 내용이 교체됩니다 (수정·추가 ${Object.keys(MG.imp.ent).length}개, 삭제 ${Object.keys(MG.imp.del).length}개, 이력 ${MG.imp.log.length}건). 지금 상태는 자동 백업에 먼저 저장됩니다.</p><div class="bar"><button class="btn" onclick="doImp()">복구 실행</button><button class="btn2" onclick="MG.imp=null;route()">취소</button></div></div>`:""}
<h3>자동 백업 (최근 3개)</h3>${ab.length?ab.map((x,i)=>`<div class="lg">${fmt(x.t)} · ${esc(x.why)} <button class="btn2" onclick="stageImp(JSON.stringify(abl()[${i}].db))">이 백업으로 복구</button></div>`).join(""):'<p class="lc">아직 자동 백업이 없습니다. 편집을 시작하거나 복구·초기화 전에 만들어집니다.</p>'}
<h3>삭제된 항목</h3>${T.length?T.map(id=>`<div class="lg">${esc(ttl(id))} · ${fmt(DB.del[id].t)} <button class="btn2" onclick="restore('${id}')">복구</button></div>`).join(""):'<p class="lc">삭제된 항목이 없습니다.</p>'}
<h3>최근 변경 이력</h3>${L.length?L.map(l=>`<div class="lg"><b>${TL[l.type]||l.type}</b> · ${fmt(l.t)} · ${DB.del[l.id]?esc(ttl(l.id)):`<a href="#${l.id}">${esc(ttl(l.id))}</a>`}${l.why?` — ${esc(l.why)}`:""}</div>`).join(""):'<p class="lc">아직 변경 이력이 없습니다.</p>'}
<h3>HTML 원본으로 되돌리기</h3>${MG.reset?`<div class="box"><p>모든 편집 내용과 이력을 지우고 HTML에 내장된 원본 데이터로 돌아갑니다. 지금 상태는 자동 백업에 먼저 저장됩니다.</p><div class="bar"><button class="btn2 dg" onclick="doReset()">초기화 확인</button><button class="btn2" onclick="MG.reset=false;route()">취소</button></div></div>`:'<div class="bar"><button class="btn2 dg" onclick="MG.reset=true;route()">원본으로 되돌리기…</button></div>'}</main>`}
function route(){
const h=location.hash.slice(1);let html;
$("#nav").innerHTML=`<a href="#all" ${h==="all"?'aria-current="page"':""}>전체</a>`+Object.keys(CATS).map(k=>`<a href="#${k}" ${h===k?'aria-current="page"':""}>${CATS[k]}</a>`).join("")+`<a href="#new" ${h==="new"?'aria-current="page"':""}>＋ 새 설정</a><a href="#manage" ${h==="manage"?'aria-current="page"':""}>관리</a>`;
const e=E.find(x=>x.id===h),ee=h.startsWith("edit-")?E.find(x=>x.id===h.slice(5)):null;
const known=!!e||!!ee||["new","manage","search","all"].includes(h)||!!CATS[h]||h==="";
if(h==="new")html=formView(null);
else if(ee)html=formView(ee);
else if(h==="manage")html=manage();
else if(e)html=detail(e);
else if(h==="search")html=search();
else if(h==="all")html=list("전체 기록",E);
else if(CATS[h]){const a=E.filter(x=>x.c===h);html=list(CATS[h],a,`<p class="note">${CATNOTE[h]}</p>`)}
else html=home();
const w=storeOk?"":'<div class="flash warn" role="alert">이 환경에서는 브라우저 저장이 되지 않습니다. 수정 내용은 새로고침하면 사라지니 관리 화면에서 백업을 복사해 두세요.</div>';
$("#app").innerHTML=w+(FL?`<div class="flash" role="status">${esc(FL)}</div>`:"")+html;FL="";
if(!known)location.hash="";
document.title=(e?e.t+" · ":"")+"니에코라 기록관 · Nyekora Archive";
}
$("#foot").innerHTML=`<p><b>자료 출처 안내.</b> 현재 기록은 대화 일부와 정리 문서에서 가져왔습니다. 원본 대화 전체와 이미지 원본은 아직 확인되지 않았고, 2차 자료만 근거인 내용은 Canon으로 표시하지 않습니다. 기록 원문은 원본 언어 그대로 보여 줍니다.</p><p>이 시제품에는 예시용으로 지어낸 설정이 없습니다. 항목 제목과 분야 배정은 찾아보기 편하도록 붙인 이름표이며 설정이 아닙니다.</p><p>편집한 내용은 이 브라우저에만 저장되며 HTML에 내장된 원본 데이터는 바뀌지 않습니다. 관리 화면에서 백업을 복사해 두세요.</p>`;
addEventListener("hashchange",()=>{F="";MODE=null;FM=null;MG={};route();scrollTo(0,0)});
load();rebuild();route();

</script>
</body>
</html>
