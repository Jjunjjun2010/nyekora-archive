<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>니에코라 마을 - 시제품</title>
  <link rel="stylesheet" href="village.css">
</head>
<body>

  <!-- 화면 상단 고정 안내 (지도 크기와 무관하게 항상 같은 위치) -->
  <div id="hud-title">니에코라 마을 (시제품)</div>
  <div id="hud-hint">건물이나 주민을 클릭하면 설명이 표시됩니다</div>
<!-- 마을 시간과 Ruwata의 현재 상태 -->
<div id="time-hud" aria-label="마을 시간 정보">
  <div class="time-row">
    <span class="time-label">마을 시간</span>
    <strong id="village-time">06:00</strong>
    <span id="village-period">아침</span>
  </div>

  <div class="time-row">
    <span class="time-label">Ruwata 상태</span>
    <strong id="ruwata-status">악기 제작 중</strong>
  </div>

  <div class="time-controls">
    <button id="time-toggle" type="button">시간 일시정지</button>
    <button id="behavior-toggle" type="button">자동 행동: 켜짐</button>
  </div>
</div>

  <!-- 창 크기에 맞춰 축소/확대되는 영역 -->
  <div id="viewport">
    <div id="stage">

      <!-- 흙길 -->
      <div class="path path-h"></div>
      <div class="path path-v"></div>

      <!-- 중앙 광장 (Kalawa) -->
      <div class="plaza"
           id="kalawa"
           data-name="카라와 (Kalawa, 중앙 광장)"
           data-desc="마을 사람들이 모여 이야기를 나누고 작은 축제가 열리는 열린 광장입니다. 배치는 아직 임시이며, 방향이나 건축 양식은 확정된 것이 아닙니다.">
      </div>

      <!-- 기록관 -->
      <div class="building archive"
           id="building-archive"
           data-name="니에코라 기록관"
           data-desc="마을의 역사와 구전 이야기를 모아 기록하고 보관하는 건물입니다. 야자잎 지붕과 목재 기둥으로 지어졌습니다.">
      </div>

      <!-- 작은 시장 -->
      <div class="building market"
           id="building-market"
           data-name="작은 시장"
           data-desc="아침마다 열리는 소규모 시장입니다. 열대 과일과 생활용품을 파는 좌판이 늘어서 있습니다.">
      </div>

      <!-- Ruwata의 악기 작업장 -->
      <div class="building workshop"
           id="building-workshop"
           data-name="루와타의 악기 작업장"
           data-desc="장인 루와타가 전통 타악기와 현악기를 만드는 작업장입니다. 나무를 깎고 다듬는 소리가 끊이지 않습니다.">
      </div>
<!--
  첫 번째 NPC: Ruwata
  초기 위치는 악기 작업장 근처이며, 위치와 이동 목적지는 임시 배치입니다.
-->
<button
  id="ruwata"
  class="npc"
  type="button"
  aria-label="Ruwata, 전통 악기 제작자"
  data-name="Ruwata"
  data-job="전통 악기 제작자"
  data-name-meaning="ruwa(물) + wata(나무)"
  data-personality="신중하고 호기심이 많음"
  data-knowledge="수랄라, 수타리"
  data-memory="아직 저장된 기억 없음"
>
  <span class="npc-name">Ruwata</span>

  <!-- 대화 중에도 기본값은 ...으로 표시 -->
  <span
    id="ruwata-speech-bubble"
    class="ruwata-speech-bubble"
    aria-live="polite"
    aria-hidden="true"
  >
    ...
  </span>

  <!-- CSS 도형으로 만든 작은 탑다운 캐릭터 -->
  <span class="npc-sprite" aria-hidden="true">
    <span class="npc-hair"></span>
    <span class="npc-head"></span>
    <span class="npc-body"></span>
    <span class="npc-arm npc-arm-left"></span>
    <span class="npc-arm npc-arm-right"></span>
  </span>
</button>
    </div>
  </div>

  <!-- 클릭 시 나타나는 설명 패널 -->
  <div id="info-panel" class="hidden">
    <button id="info-close" aria-label="닫기">✕</button>
    <h2 id="info-title"></h2>
    <p id="info-desc"></p>
<!-- NPC를 클릭했을 때만 나타나는 상세 정보 -->
<dl id="npc-details" class="npc-details hidden" aria-label="NPC 상세 정보">
  <div>
    <dt>이름 뜻</dt>
    <dd id="npc-meaning"></dd>
  </div>
  <div>
    <dt>직업</dt>
    <dd id="npc-job"></dd>
  </div>
  <div>
    <dt>성격</dt>
    <dd id="npc-personality"></dd>
  </div>
  <div>
    <dt>지식</dt>
    <dd id="npc-knowledge"></dd>
  </div>
  <div>
    <dt>기억</dt>
    <dd id="npc-memory"></dd>
  </div>
  <div>
  <dt>현재 상태</dt>
  <dd id="npc-current-status"></dd>
</div>
</dl>

<!-- NPC를 클릭했을 때만 나타나는 이동 버튼 -->
<div id="npc-actions" class="npc-actions hidden">
  <p class="npc-actions-title">이동할 장소</p>

  <button type="button" data-destination="kalawa">
    kalawa 광장
  </button>

  <button type="button" data-destination="workshop">
    악기 작업장
  </button>
</div>
  </div>

  <!-- Ruwata 대화창 -->
  <section
    id="ruwata-chat"
    class="ruwata-chat hidden"
    aria-labelledby="ruwata-chat-title"
  >
    <header class="ruwata-chat-header">
      <div>
        <h2 id="ruwata-chat-title">Ruwata</h2>
        <p>전통 악기 제작자</p>
      </div>

      <button
        id="ruwata-chat-close"
        class="ruwata-chat-close"
        type="button"
        aria-label="대화창 닫기"
      >
        ✕
      </button>
    </header>

    <div
      id="ruwata-chat-messages"
      class="ruwata-chat-messages"
      aria-live="polite"
      aria-label="Ruwata와의 대화 내용"
    ></div>

    <form id="ruwata-chat-form" class="ruwata-chat-form">
      <label class="sr-only" for="ruwata-chat-input">
        Ruwata에게 보낼 메시지
      </label>

      <input
        id="ruwata-chat-input"
        type="text"
        maxlength="300"
        autocomplete="off"
        placeholder="Ruwata에게 말을 걸어 보세요"
      >

      <button type="submit">전송</button>
    </form>

    <p class="ruwata-chat-note">
      AI(Ollama Cloud)가 생성한 응답입니다. 내용이 사실과 다를 수 있습니다.
    </p>
  </section>

  <script src="village.js"></script>
</body>
</html>
